name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.23.5", "24.22.3", "26.13.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # offline tests only — the nanoodle devDependency runs `inspect` locally;
      # no network calls and no API keys are needed here.
      - run: npm ci
      - run: npm test
